apiVersion: v1
kind: ConfigMap
metadata:
  name: tinycache-config
data:
  TC_ADDR: "0.0.0.0:11211"
  TC_INTERNAL_ADDR: "0.0.0.0:11311"
  TC_CLUSTER_REPLICAS: "3"
  TC_SERVICE_NAME: "tinycache"
  TC_REPLICATION_FACTOR: "3"
  TC_WRITE_QUORUM: "2"
  TC_READ_QUORUM: "1"
  TC_QUORUM_TIMEOUT_MS: "50"
  TC_VIRTUAL_NODES: "150"
  TC_REPAIR_ENABLED: "true"
  TC_MAX_MEMORY_MB: "256"
  TC_DEFAULT_TTL_SECONDS: "0"
  TC_EVICTION_INTERVAL_MS: "500"
  TC_PERSISTENCE_ENABLED: "true"
  TC_DATA_DIR: "/data"
  TC_AOF_ENABLED: "true"
  TC_AOF_FSYNC: "everysec"
  TC_AOF_MAX_SIZE_MB: "512"
  TC_SNAPSHOT_ENABLED: "true"
  TC_SNAPSHOT_INTERVAL_SECONDS: "300"
  TC_SNAPSHOT_MIN_CHANGES: "1000"
  TC_HEALTH_ADDR: "0.0.0.0:9090"
  TC_SHUTDOWN_TIMEOUT_SECONDS: "30"
  TC_MAX_CONNECTIONS: "10000"
  TC_READ_TIMEOUT_MS: "5000"
  TC_WRITE_TIMEOUT_MS: "5000"
